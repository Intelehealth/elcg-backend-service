# Auth Gateway Deploy
#
# Builds the auth-gateway Docker image once and deploys it automatically to
# the revamp host on every relevant push.
#
# Triggers:
#   - push to dev_master (auth-gateway/** changes) → deploys automatically to the revamp host
#
# Jobs:
#   1. build    Builds the Docker image and uploads it as a workflow artifact
#   2. deploy   Downloads the artifact and deploys it to the revamp host
#
# Required secrets:
#   REVAMP_HOST  — SSH hostname/IP
#   SSH_USER     — SSH username
#   SSH_KEY      — SSH private key

name: Auth Gateway Deploy

on:
  push:
    branches: [dev_master]
    paths:
      - 'auth-gateway/**'

env:
  DOCKER_IMAGE_NAME: auth-gateway

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      migrations_changed: ${{ steps.check-migrations.outputs.changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: auth-gateway/package-lock.json

      - name: Install dependencies
        run: npm i --production=false
        working-directory: auth-gateway

      - name: Check for migration file changes
        id: check-migrations
        run: |
          if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -q "^auth-gateway/migrations/" \
              && echo "changed=true" >> $GITHUB_OUTPUT \
              || echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Docker image
        run: |
          docker build -t $DOCKER_IMAGE_NAME:${{ github.sha }} ./auth-gateway
          # migrator: sequelize-cli + migrations/config, none of which the runtime
          # image carries (devDependencies are stripped, migrations/config are
          # never COPYed) — `docker exec` into the app container cannot migrate.
          docker build --target migrator -t $DOCKER_IMAGE_NAME-migrator:${{ github.sha }} ./auth-gateway
          docker save $DOCKER_IMAGE_NAME:${{ github.sha }} $DOCKER_IMAGE_NAME-migrator:${{ github.sha }} > app-image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: auth-gateway-image
          path: app-image.tar
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      REMOTE_PORT: 22
      ENV_FILE_PATH: /home/ubuntu/deploy/auth-gateway/.env
      PEM_FOLDER_PATH: /home/ubuntu/deploy/auth-gateway/.pem
      # JWT signing keys — never baked into the image (keys/ is gitignored), so
      # they live on the host and are bind-mounted in, same as the TLS certs.
      KEYS_FOLDER_PATH: /home/ubuntu/deploy/auth-gateway/keys
      REMOTE_HOST: ${{ secrets.REVAMP_HOST }}
      REMOTE_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_KEY }}
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@v4
        with:
          name: auth-gateway-image

      - name: Deploy to revamp host
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          scp -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -P $REMOTE_PORT \
              app-image.tar \
              $REMOTE_USER@$REMOTE_HOST:/tmp/

          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -p $REMOTE_PORT \
              $REMOTE_USER@$REMOTE_HOST <<EOF
            DOCKER_IMAGE_NAME="${{ env.DOCKER_IMAGE_NAME }}"
            ENV_FILE_PATH="${{ env.ENV_FILE_PATH }}"
            PEM_FOLDER_PATH="${{ env.PEM_FOLDER_PATH }}"
            KEYS_FOLDER_PATH="${{ env.KEYS_FOLDER_PATH }}"
            MIGRATIONS_CHANGED="${{ needs.build.outputs.migrations_changed }}"

            docker load -i /tmp/app-image.tar
            rm /tmp/app-image.tar

            docker stop \$DOCKER_IMAGE_NAME || true
            docker rm \$DOCKER_IMAGE_NAME || true

            if [ ! -f "\$ENV_FILE_PATH" ]; then
              echo "Error: .env file not found at \$ENV_FILE_PATH"
              exit 1
            fi

            if [ ! -d "\$PEM_FOLDER_PATH" ]; then
              echo "Error: .pem folder not found at \$PEM_FOLDER_PATH"
              exit 1
            fi

            if [ ! -d "\$KEYS_FOLDER_PATH" ]; then
              echo "Error: JWT keys folder not found at \$KEYS_FOLDER_PATH"
              exit 1
            fi

            if [ "\$MIGRATIONS_CHANGED" = "true" ]; then
              echo "Running database migrations..."
              docker run --rm \
                --env-file \$ENV_FILE_PATH \
                \$DOCKER_IMAGE_NAME-migrator:${{ github.sha }}
            fi

            docker ps -a | grep auth-gateway | awk '{print $1}' | xargs -r docker rm -f || true

            fuser -k 3030/tcp || true

            sleep 2

            docker run -d \
              --name \$DOCKER_IMAGE_NAME \
              --restart unless-stopped \
              -p 3030:3030 \
              --env-file \$ENV_FILE_PATH \
              -v \$PEM_FOLDER_PATH:/app/.pem \
              -v \$KEYS_FOLDER_PATH:/app/keys \
              --mount type=bind,src=/etc/letsencrypt,dst=/etc/letsencrypt,ro \
              \$DOCKER_IMAGE_NAME:${{ github.sha }}

            docker image prune -f
            echo "Auth-gateway deployment completed successfully"
          EOF

      - name: Verify deployment
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh -i ~/.ssh/deploy_key \
              -o StrictHostKeyChecking=no \
              -p $REMOTE_PORT \
              $REMOTE_USER@$REMOTE_HOST \
              "docker ps | grep $DOCKER_IMAGE_NAME && echo 'Auth-gateway deployment successful!'"
